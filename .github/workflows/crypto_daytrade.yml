name: Crypto Daytrade — Sinais Técnicos Binance

on:
  # SEM `schedule:` de propósito (removido em 2026-09-08). O evento `schedule` do GitHub
  # Actions não garante frequência sub-horária — medido na prática com `*/10 * * * *`
  # configurado, ele só disparou de verdade 3x em ~11h (intervalos de ~3h, não 10 min); é fila
  # de agendamento do GitHub, não bug deste YAML. A cadência real de 10 min vem de um cron
  # externo (cron-job.org) chamando `workflow_dispatch` via API a cada 10 min — ver seção
  # "Automação" do CLAUDE.md. Não readicione `schedule:` sem revisitar essa decisão.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan-signals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto-daytrade
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Resolver sinais abertos e escanear por sinal novo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CRYPTO_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CRYPTO_TELEGRAM_CHAT_ID }}
          # Runner do Actions roda em datacenter dos EUA -> Binance devolve 451 pra chamada
          # direta (descoberto em 2026-09-08). CRYPTO_BINANCE_PROXY_URL aponta pro
          # binance-proxy/ (fora dos EUA); enquanto o secret não existir, BASE_URL cai no
          # default (Binance direta) e volta a tomar 451 — ver README de binance-proxy/.
          BINANCE_API_BASE_URL: ${{ secrets.CRYPTO_BINANCE_PROXY_URL }}
        run: python main.py

      - name: Salvar histórico de sinais
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add storage/signals.json
          git diff --staged --quiet || git commit -m "chore: atualiza histórico de sinais"
          git push
