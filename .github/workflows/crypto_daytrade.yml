name: Crypto Daytrade — Sinais Técnicos Binance

on:
  schedule:
    # A cada 10 minutos — cripto se move a qualquer hora, diferente do bot de apostas (que só
    # roda 1x/dia porque jogo tem horário certo). Repositório TradeBot é público, então não
    # tem limite de minutos do GitHub Actions (só repositório privado tem o teto de 2.000
    # min/mês do free tier) — a frequência aqui é só uma escolha de produto, não uma
    # restrição técnica.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan-signals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto-daytrade
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Resolver sinais abertos e escanear por sinal novo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CRYPTO_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CRYPTO_TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Salvar histórico de sinais
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add storage/signals.json
          git diff --staged --quiet || git commit -m "chore: atualiza histórico de sinais"
          git push
