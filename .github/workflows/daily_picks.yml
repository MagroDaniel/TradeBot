name: Daily Picks — Sports Betting Bot

# (Republicado pra forçar o GitHub a reindexar o workflow.)
on:
  schedule:
    # 11:00 UTC = 08:00 BRT (UTC-3). Ajuste se estiver em outro fuso.
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sports-betting
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Rodar job diário (resultados de ontem + picks de hoje)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Salvar histórico de picks atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add storage/picks.json
          git diff --staged --quiet || git commit -m "chore: atualiza histórico de picks"
          git push
