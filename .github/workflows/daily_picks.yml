name: Daily Picks — Sports Betting Bot

# (Republicado pra forçar o GitHub a reindexar o workflow.)
on:
  schedule:
    # 10:00 UTC = 07:00 BRT (UTC-3, fixo — Brasil não observa horário de verão). Ajuste se
    # estiver em outro fuso.
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sports-betting
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Rodar job diário (resultados de ontem + picks de hoje)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEYS_EXTRA: ${{ secrets.ODDS_API_KEYS_EXTRA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ANTHROPIC_API_KEY desativada de propósito (decisão do usuário, 09/09/2026): a
          # checagem de notícias não influencia a decisão do pick (é só informativa), então não
          # vale o custo de token. Sem essa variável, config.ANTHROPIC_API_KEY vira None e
          # main.py::_check_news retorna {} sem chamar a API — o secret continua guardado no
          # GitHub, só não é mais repassado pro job. Pra reativar, devolva esta linha:
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: Salvar histórico de picks atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add storage/picks.json
          git diff --staged --quiet || git commit -m "chore: atualiza histórico de picks"
          git push
