name: Forex — Backtest (temporário)

# Workflow temporário só pra rodar o primeiro backtest real do forex-daytrade dentro do
# Actions (esta sessão não tem saída de rede até a Twelve Data). Sem gatilho de schedule — só
# disparo manual. Remover depois de decidir se a estratégia baseline tem expectância positiva
# em forex (ver forex-daytrade/README.md).

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Quantos dias de histórico buscar"
        required: false
        default: "60"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forex-daytrade
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Rodar backtest
        env:
          TELEGRAM_BOT_TOKEN: dummy-for-backtest-only
          TELEGRAM_CHAT_ID: dummy-for-backtest-only
          TWELVEDATA_API_KEY: ${{ secrets.FOREX_TWELVEDATA_API_KEY }}
        run: python -m backtest.run --days ${{ github.event.inputs.days }}
