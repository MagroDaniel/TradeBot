name: Forex — Teste do calendário Forex Factory (temporário)

# Workflow temporário só pra validar o formato real do feed da Forex Factory antes de confiar
# no parsing de data/forexfactory_client.py. Remover depois de confirmar.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forex-daytrade
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Testar feed da Forex Factory
        run: |
          python3 -c "
          from data.forexfactory_client import ForexFactoryClient
          import json

          client = ForexFactoryClient()
          events = client.get_week_events()
          print(f'Total de eventos na semana: {len(events)}')
          print()
          print('--- 3 primeiros eventos brutos (pra conferir schema) ---')
          import requests
          raw = requests.get('https://nfs.faireconomy.media/ff_calendar_thisweek.json', timeout=15).json()
          for r in raw[:3]:
              print(json.dumps(r, indent=2))
          print()
          print('--- eventos de alto impacto relevantes (USD/EUR/GBP) ---')
          relevant = client.get_relevant_high_impact_events()
          for e in relevant[:10]:
              print(f'{e.date} | {e.country} | {e.impact} | {e.title} | forecast={e.forecast} previous={e.previous} actual={e.actual}')
          print(f'Total relevantes: {len(relevant)}')
          "
