name: Release (TradeBot.exe)

# Gera o executável do Windows e publica uma Release. Dois jeitos de disparar:
#   - enviar uma tag de versão: git tag v0.2.0 && git push origin v0.2.0
#   - aba Actions do GitHub → "Release (TradeBot.exe)" → Run workflow: usa a versão do código
#     (`__version__`) e cria a tag v<versão> no commit escolhido.
# A versão tem que bater com `__version__` em tradebot/__init__.py, e o CHANGELOG.md precisa ter
# uma seção "## v0.2.0" (vira o texto da release e as notas no botão "Atualizar" do painel).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install -r requirements.txt -r requirements-build.txt

      - name: Testes
        run: pytest -q

      - name: Tag da release
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          else { $tag = "v" + (python -c "import tradebot; print(tradebot.__version__)") }
          git fetch --tags --quiet
          if ("${{ github.ref_type }}" -ne "tag" -and (git tag -l $tag)) {
            Write-Error "A versao $tag ja foi publicada: suba __version__ e o CHANGELOG antes"; exit 1
          }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Versão da tag = versão do código
        run: python scripts/release_notes.py "${{ env.TAG }}" > release_notes.md

      - name: Gerar TradeBot.exe
        run: pyinstaller --noconfirm TradeBot.spec

      - name: Autoteste do executável
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\TradeBot.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "self-test falhou ($($p.ExitCode))"; exit 1 }

      - name: SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\TradeBot.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TradeBot.exe" | Out-File -Encoding ascii -NoNewline dist\TradeBot.exe.sha256
          Get-Content dist\TradeBot.exe.sha256

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: TradeBot ${{ env.TAG }}
          body_path: release_notes.md
          files: |
            dist/TradeBot.exe
            dist/TradeBot.exe.sha256
